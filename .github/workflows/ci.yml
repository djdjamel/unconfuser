name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'fix/**'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
      with:
        dotnet-version: |
          8.0.x
          6.0.x

    - name: Setup Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Restore dependencies
      run: dotnet restore unconfuser.sln

    - name: Build solution across all TFMs (Release)
      run: dotnet build unconfuser.sln -c Release --no-restore

    - name: Generate Synthetic Deobfuscation Fixtures
      run: dotnet .\benchmarks\FixtureGenerator\bin\Release\net8.0-windows\FixtureGenerator.dll --input benchmarks\BenignSample\bin\Release\net8.0\BenignSample.dll --output-dir benchmarks\fixtures

    - name: Generate Behavioral Verification Fixtures
      run: powershell -ExecutionPolicy Bypass -File scripts/Generate-VerificationFixtures.ps1

    - name: Provision ConfuserEx Toolchain
      run: python benchmarks/provision_confuserex.py

    - name: Prepare Real ConfuserEx Fixture
      run: python benchmarks/prepare_real_fixture.py

    - name: Run C# Unit & Integration Tests
      run: dotnet test unconfuser.sln -c Release --no-build --verbosity normal

    - name: Run Deobfuscation Benchmark Suite
      run: python benchmarks/run_benchmark.py

    - name: Verify Real Deobfuscated Output Safely
      run: powershell -ExecutionPolicy Bypass -File scripts/Verify-DeobfuscatedBinary.ps1 -Target benchmarks/fixtures/real_confuserex/BenignSample_clean.exe -ReportJson benchmarks/verify_deobfuscated_report.json -CommitHash "${{ github.sha }}"

    - name: Verify Benign Baseline Reference Safely
      run: powershell -ExecutionPolicy Bypass -File scripts/Verify-DeobfuscatedBinary.ps1 -Target benchmarks/BenignSample/bin/Release/net48/BenignSample.exe -ReportJson benchmarks/verify_benign_report.json -CommitHash "${{ github.sha }}"

    - name: Verify PEVerify Availability and Execute Official Runner Verification
      run: powershell -ExecutionPolicy Bypass -File scripts/Verify-PEVerifyOnRunner.ps1 -Target benchmarks/BenignSample/bin/Release/net48/BenignSample.exe -LogPath benchmarks/peverify_runner_verification.log

    - name: Run Python Pytest Suite
      if: success() || failure()
      run: python -m pytest tests -v

    - name: Run Python Detector Regression Suite
      if: success() || failure()
      run: python test_detector.py

    - name: Upload Benchmark Reports
      if: always()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: benchmark-reports
        path: |
          benchmarks/benchmark_report.md
          benchmarks/benchmark_report.json
          benchmarks/verify_benign_report.json
          benchmarks/verify_deobfuscated_report.json
          benchmarks/peverify_runner_verification.log
          benchmarks/corpus_evaluation_report.json



