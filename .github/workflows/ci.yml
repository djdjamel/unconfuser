name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Restore dependencies
      run: dotnet restore unconfuser.sln

    - name: Build solution (Release)
      run: dotnet build unconfuser.sln -c Release --no-restore

    - name: Run C# Unit Tests
      run: dotnet test unconfuser.sln -c Release --no-build --verbosity normal

    - name: Generate Deobfuscation Benchmark Fixtures
      run: dotnet .\benchmarks\FixtureGenerator\bin\Release\net8.0-windows\FixtureGenerator.dll --input benchmarks\BenignSample\bin\Release\net8.0\BenignSample.dll --output-dir benchmarks\fixtures

    - name: Run Deobfuscation Benchmark Suite
      run: python benchmarks/run_benchmark.py

    - name: Run Python Pytest Suite
      run: python -m pytest tests -v

    - name: Run Python Detector Regression Suite
      run: python test_detector.py

